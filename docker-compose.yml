services:
  spdm-ui:
    image: node:22-alpine
    container_name: spdm-ui
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    env_file:
      - .env
    environment:
      MIROFISH_BACKEND_URL: "http://mirofish:5001"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - spdm_node_modules:/app/node_modules

  mirofish:
    build:
      context: ./vendor/mirofish
    container_name: spdm-mirofish
    env_file:
      - .env
    environment:
      LLM_BASE_URL: "http://ollama:11434/v1"
      EMBEDDING_BASE_URL: "http://ollama:11434"
      NEO4J_URI: "bolt://neo4j:7687"
    ports:
      - "3002:3000"
      - "5001:5001"
    volumes:
      - ./vendor/mirofish/backend/uploads:/app/backend/uploads
      - ./samples:/app/samples:ro
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  neo4j:
    image: neo4j:5.18-community
    container_name: spdm-neo4j
    hostname: neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mirofish}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - spdm_neo4j_data:/data
      - spdm_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: spdm-ollama
    ports:
      - "11434:11434"
    volumes:
      - spdm_ollama_data:/root/.ollama

volumes:
  spdm_node_modules:
  spdm_neo4j_data:
  spdm_neo4j_logs:
  spdm_ollama_data:
